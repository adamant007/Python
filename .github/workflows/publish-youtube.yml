name: Publish Short Directly to YouTube

on:
  push:
    branches: [main]
    paths:
      - 'videos/*.mp4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-direct-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether YouTube OAuth is configured
        id: creds
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "YouTube OAuth secrets are not configured yet; skipping upload."
          fi

      - name: Upload and schedule on YouTube
        if: steps.creds.outputs.configured == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/publish_youtube.py

      - name: Commit YouTube publication marker
        if: steps.creds.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-youtube/
          if git diff --cached --quiet; then
            echo "No YouTube publication marker change."
            exit 0
          fi
          git commit -m "Record direct YouTube upload [skip publish]"
          git push
