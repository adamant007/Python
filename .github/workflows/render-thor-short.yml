name: Render Thor Mythology Short

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_thor_short.sh'
      - '.github/workflows/render-thor-short.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render vertical Short
        run: bash scripts/render_thor_short.sh

      - name: Commit rendered video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/thor-bride-short.mp4
          if git diff --cached --quiet; then
            echo "No video change to commit."
            exit 0
          fi
          git commit -m "Render Thor mythology Short [skip render]"
          git push
