name: Publish Short to YouTube via Buffer

on:
  push:
    branches: [main]
    paths:
      - 'videos/*.mp4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-buffer-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish current rendered Short
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: python3 scripts/publish_buffer.py

      - name: Commit publication marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/
          if git diff --cached --quiet; then
            echo "No publication marker change."
            exit 0
          fi
          git commit -m "Record Buffer YouTube schedule [skip publish]"
          git push
